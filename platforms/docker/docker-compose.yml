services:
  enigmagent:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["--mode", "rest", "--bind", "0.0.0.0", "--port", "3737"]
    ports:
      - "127.0.0.1:3737:3737"
    environment:
      ENIGMAGENT_USER: ${ENIGMAGENT_USER:?Set the vault username}
      ENIGMAGENT_PASS: ${ENIGMAGENT_PASS:?Set the vault password outside source control}
      ENIGMAGENT_API_TOKEN: ${ENIGMAGENT_API_TOKEN:?Set a random broker connection token}
      ENIGMAGENT_VAULT: /data/vault.json
    volumes:
      - ${ENIGMAGENT_DATA_DIRECTORY:?Select the existing vault directory}:/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"

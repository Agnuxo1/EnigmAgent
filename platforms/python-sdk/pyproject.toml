[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enigmagent"
version = "3.0.0"
description = "Authenticated local credential broker client and ten native fixed-operation framework integrations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Francisco Angulo de Lafuente", email = "agnuxo1@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["enigmagent", "vault", "credentials", "broker", "mcp", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.optional-dependencies]
langchain = ["langchain-core==1.6.3"]
langgraph = ["langgraph==1.2.11", "langchain-core==1.6.3"]
llamaindex = ["llama-index-core==0.14.24"]
crewai = ["crewai==1.15.22"]
haystack = ["haystack-ai==3.1.1"]
agent-framework = ["agent-framework-core==1.18.0"]
smolagents = ["smolagents==1.26.0"]
agno = ["agno==3.0.10"]
pydantic-ai = ["pydantic-ai-slim==2.44.0"]
autogen = ["autogen-core==0.7.5"]
all = [
    "langchain-core==1.6.3", "langgraph==1.2.11", "llama-index-core==0.14.24",
    "crewai==1.15.22", "haystack-ai==3.1.1", "agent-framework-core==1.18.0",
    "smolagents==1.26.0", "agno==3.0.10", "pydantic-ai-slim==2.44.0", "autogen-core==0.7.5",
]
test = ["pytest==9.1.1", "build>=1.2,<2", "hatchling>=1.27,<2", "mcp==1.28.1", "anthropic==1.6.0"]

[project.urls]
Homepage = "https://github.com/Agnuxo1/EnigmAgent"
Documentation = "https://github.com/Agnuxo1/EnigmAgent/blob/main/docs/INTEGRATED_RELEASE_V3.md"
Repository = "https://github.com/Agnuxo1/EnigmAgent"
"Bug Tracker" = "https://github.com/Agnuxo1/EnigmAgent/issues"

[tool.hatch.build.targets.wheel]
packages = ["enigmagent"]

[tool.hatch.build.targets.sdist]
include = ["enigmagent/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

name: Integrated release verification

on:
  push:
    branches: [main, release/integrated-vault-2026-09-17]
    tags: ['integrated-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gateway:
    uses: ./.github/workflows/gateway-security.yml

  python:
    name: Native Python frameworks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the locked gateway dependency
        working-directory: platforms/mcp-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the exact native framework versions into the disposable runner
        run: |
          python -m pip install uv==0.11.33
          uv pip install --system "./platforms/python-sdk[all,test]"
      - name: Execute real Python, native framework and official MCP-client tests
        run: python scripts/run-python-tests.py tests -q
      - name: Build the Python wheel and source distribution
        run: python -m build --wheel --sdist platforms/python-sdk
      - name: Verify an isolated offline wheel installation and source equivalence
        run: python scripts/verify-python-package.py platforms/python-sdk/dist/enigmagent-3.0.0-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-release-${{ matrix.os }}
          path: |
            platforms/python-sdk/dist/*.whl
            platforms/python-sdk/dist/*.tar.gz
            audit/integration-runtime-evidence.json
            audit/python-package-evidence.json
          if-no-files-found: error
          retention-days: 7

  node-packages:
    name: Clean standalone Node packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/package-node.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-release
          path: |
            release-artifacts/*.tgz
            audit/node-package-evidence.json
          if-no-files-found: error
          retention-days: 7

  container:
    name: Built-source Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the pinned-source non-root image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag enigmagent:3.0.0 .
      - name: Run real container authentication and version checks with synthetic data
        run: python3 scripts/test-container.py --image enigmagent:3.0.0
      - name: Export the exact tested image
        run: |
          mkdir -p release-artifacts
          docker save enigmagent:3.0.0 | gzip > release-artifacts/enigmagent-3.0.0-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-release
          path: |
            release-artifacts/enigmagent-3.0.0-image.tar.gz
            audit/container-runtime-evidence.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish only the tested versioned artifacts
    needs: [gateway, python, node-packages, container]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/integrated-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: node-release
          path: published/node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-release-ubuntu-latest
          path: published/python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: container-release
          path: published/container
      - name: Collect immutable artifacts and compute their checksums
        run: python3 scripts/collect-release.py
      - name: Create a versioned GitHub release without changing package registries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release with this immutable version already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" publish-ready/*             --repo "$GITHUB_REPOSITORY" --verify-tag             --title 'EnigmAgent 3.0.0 - authenticated vault and ten native integrations'             --notes-file docs/RELEASE_NOTES_V3.md

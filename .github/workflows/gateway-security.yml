name: Gateway security tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
    defaults:
      run:
        working-directory: platforms/mcp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: platforms/mcp-server/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run real transport and synthetic encrypted-vault tests
        run: npm test
      - name: Verify packaged runtime files
        run: node tests/verify-package.mjs
